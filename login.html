<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'">

    <meta
        name="description"
        content="ورود و ثبت‌نام در آکادمی مشاوره تحصیلی پایه"
    >

    <meta name="theme-color" content="#FFFCF5">

    <title>ورود / ثبت‌نام | پایه</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="payeh-login">

        <div class="payeh-login__background">
            <span class="payeh-login__shape payeh-login__shape--one"></span>
            <span class="payeh-login__shape payeh-login__shape--two"></span>
            <span class="payeh-login__shape payeh-login__shape--three"></span>
        </div>

        <div class="payeh-login__container">

            <div class="payeh-login__card">

                <div class="payeh-login__brand">
                    <a href="index.html" class="payeh-login__logo" aria-label="صفحه اصلی پایه">
                        <img src="assets/images/logo.png" alt="آکادمی پایه" style="height: 62px; width: auto; object-fit: contain;">
                    </a>
                </div>

                <div class="payeh-auth-tabs">
                    <a href="login.html" class="payeh-auth-tab is-active">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                        <span>ورود به حساب</span>
                    </a>
                    <a href="signup.html" class="payeh-auth-tab">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                        <span>ثبت‌نام دانش‌آموز</span>
                    </a>
                </div>

                <div class="payeh-login__heading">



                    <h1 class="payeh-login__title">
                        ورود به حساب کاربری
                    </h1>

                    <p class="payeh-login__description">
                        برای ادامه مسیر تحصیلی خود وارد حساب کاربری شوید.
                    </p>

                </div>

                <form
                    class="payeh-login__form"
                    id="payeh-login-form"
                    novalidate
                >

                    <div class="payeh-login__field">

                        <label
                            class="payeh-login__label"
                            for="payeh-login-phone"
                        >
                            شماره موبایل یا ایمیل
                        </label>

                        <div class="payeh-login__input-wrapper">

                            <span class="payeh-login__input-icon">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-phone-incoming preview-icon"><path d="M16 2v6h6"/><path d="m22 2-6 6"/><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg>
                            </span>

                            <input
                                id="payeh-login-phone"
                                class="payeh-login__input"
                                type="text"
                                autocomplete="username"
                                placeholder="۰۹۱۲۱۲۳۴۵۶۷ یا ایمیل شما"
                                maxlength="100"
                                required
                            >

                        </div>

                        <span
                            class="payeh-login__error"
                            id="payeh-login-phone-error"
                        ></span>

                    </div>

                    <div class="payeh-login__field">

                        <label
                            class="payeh-login__label"
                            for="payeh-login-password"
                        >
                            رمز عبور
                        </label>

                        <div class="payeh-login__input-wrapper">

                            <span class="payeh-login__input-icon">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-key-square preview-icon"><path d="M12.4 2.7a2.5 2.5 0 0 1 3.4 0l5.5 5.5a2.5 2.5 0 0 1 0 3.4l-3.7 3.7a2.5 2.5 0 0 1-3.4 0L8.7 9.8a2.5 2.5 0 0 1 0-3.4z"/><path d="m14 7 3 3"/><path d="m9.4 10.6-6.814 6.814A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814"/></svg>
                            </span>

                            <input
                                id="payeh-login-password"
                                class="payeh-login__input payeh-login__input--password"
                                type="password"
                                autocomplete="current-password"
                                placeholder="رمز عبور خود را وارد کنید"
                                required
                            >

                            <button
                                type="button"
                                class="payeh-login__password-toggle"
                                id="payeh-login-password-toggle"
                                aria-label="نمایش رمز عبور"
                            >
                                <svg
                                    class="payeh-login__eye-open"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >
                                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                                    <circle cx="12" cy="12" r="2.5"></circle>
                                </svg>

                                <svg
                                    class="payeh-login__eye-closed"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >
                                    <path d="m3 3 18 18"></path>
                                    <path d="M10.6 6.2A9.7 9.7 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.1 3.7"></path>
                                    <path d="M6.7 6.7C4 8.2 2.5 12 2.5 12s3.5 6 9.5 6a9.7 9.7 0 0 0 2-.2"></path>
                                </svg>
                            </button>

                        </div>

                        <span
                            class="payeh-login__error"
                            id="payeh-login-password-error"
                        ></span>

                    </div>

                    <div class="payeh-login__options">

                        <label class="payeh-login__remember">
                            <input
                                type="checkbox"
                                id="payeh-login-remember"
                            >

                            <span class="payeh-login__checkbox"></span>

                            <span>
                                مرا به خاطر بسپار
                            </span>
                        </label>

                        <a
                            href="#"
                            class="payeh-login__forgot"
                        >
                            رمز عبور را فراموش کرده‌اید؟
                        </a>

                    </div>

                    <button
                        type="submit"
                        class="payeh-login__submit"
                    >
                        <span>ورود به حساب</span>

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14"></path>
                            <path d="m13 6 6 6-6 6"></path>
                        </svg>
                    </button>

                    <div
                        class="payeh-login__message"
                        id="payeh-login-message"
                        role="status"
                        aria-live="polite"
                    ></div>

                </form>

                <div class="payeh-login__divider">
                    <span>یا</span>
                </div>

                <div class="payeh-login__register">
                    <span>
                        هنوز حساب کاربری ندارید؟
                    </span>
                    <a href="signup.html">
                        ثبت‌نام کنید
                    </a>
                </div>

                <div class="payeh-login__register" style="margin-top: 8px;">
                    <span>
                        متقاضی همکاری به‌عنوان مشاور هستید؟
                    </span>
                    <a href="consultant-register.html">
                        ثبت‌نام و ارسال رزومه مشاور
                    </a>
                </div>

                <a
                    href="index.html"
                    class="payeh-login__back"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14 6 8 12l6 6"></path>
                    </svg>

                    <span>
                        بازگشت به صفحه اصلی
                    </span>
                </a>

            </div>

            <p class="payeh-login__copyright">
                © ۱۴۰۵ - آکادمی مشاوره تحصیلی پایه
            </p>

        </div>

    </main>

    <script src="js/login.js?v=20261016_2"></script>

</body>

</html>
