services:
  db:
    image: postgres:16-alpine
    container_name: paye_academy_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-paye_academy}
      POSTGRES_USER: ${DB_USER:-paye_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paye_secure_password_2026}
    volumes:
      - paye_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paye_user} -d ${DB_NAME:-paye_academy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: paye_academy_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - paye_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paye_academy_web
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=127.0.0.1
      - DB_PORT=5433
      - REDIS_URL=redis://127.0.0.1:6379/1
    volumes:
      - ./:/app
      - ./backend/media:/app/backend/media
      - ./backend/staticfiles:/app/backend/staticfiles
    command: ["gunicorn", "config.wsgi:application", "--bind", "127.0.0.1:8001", "--workers", "3", "--timeout", "120"]

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paye_academy_bot
    restart: unless-stopped
    network_mode: host
    depends_on:
      web:
        condition: service_started
    env_file:
      - .env
    environment:
      - DB_HOST=127.0.0.1
      - DB_PORT=5433
      - REDIS_URL=redis://127.0.0.1:6379/1
    volumes:
      - ./:/app
      - ./backend/media:/app/backend/media
    command: ["python", "manage.py", "run_telegram_bot"]

volumes:
  paye_postgres_data:
  paye_redis_data:
