<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self' data:; connect-src 'self'; form-action 'self'">
  <title>گفت‌وگوی مشاوره | آکادمی پایه</title>
  <link rel="stylesheet" href="css/fonts.css"><link rel="stylesheet" href="css/blog.css"><link rel="stylesheet" href="css/consultations.css">
</head>
<body class="blog-app chat-app">
  <header class="blog-topbar"><a class="blog-brand" href="index.html">آکادمی <strong>پایه</strong></a><nav><a id="chat-back-link" href="student.html">بازگشت به پنل</a></nav></header>
  <main class="consultation-shell chat-shell">
    <section class="consultation-panel chat-panel">
      <header class="chat-header">
        <a id="chat-back-link-mobile" class="chat-back" href="student.html" aria-label="بازگشت">‹</a>
        <div class="chat-avatar" aria-hidden="true">پ</div>
        <div class="chat-header__info"><h1 id="chat-title">گفت‌وگوی مشاوره</h1><p>گفت‌وگوی خصوصی دانش‌آموز و مشاور</p></div>
        <span class="chat-lock" title="گفت‌وگوی خصوصی">🔒</span>
      </header>
      <div id="chat-limit" class="chat-quota" aria-live="polite"></div>
      <div id="chat-messages" class="chat-messages" aria-live="polite"><p class="chat-placeholder">در حال دریافت پیام‌ها…</p></div>
      <form id="chat-form" class="chat-form">
        <label for="chat-body" class="visually-hidden">متن پیام</label>
        <textarea id="chat-body" maxlength="4000" rows="1" placeholder="پیام خود را بنویسید…"></textarea>
        <input id="chat-image" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <button id="chat-attach" class="chat-attach" type="button" aria-label="پیوست تصویر" title="ارسال تصویر">＋</button>
        <button id="chat-send" class="chat-send" type="submit" aria-label="ارسال پیام">ارسال</button>
        <div id="chat-image-preview" class="chat-image-preview" hidden></div>
        <p id="chat-error" class="consultation-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="js/consultation-chat.js"></script>
</body>
</html>
