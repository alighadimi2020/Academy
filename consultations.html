<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'">
  <title>انتخاب مشاور | آکادمی پایه</title>
  <link rel="stylesheet" href="css/fonts.css"><link rel="stylesheet" href="css/blog.css"><link rel="stylesheet" href="css/consultations.css">
</head>
<body class="blog-app">
  <header class="blog-topbar"><a class="blog-brand" href="student.html">پنل دانش‌آموز <strong>پایه</strong></a><nav><a href="student.html">بازگشت به پنل</a></nav></header>
  <main class="consultation-shell">
    <section class="consultation-panel">
      <div class="blog-intro"><span class="blog-eyebrow">مشاوره تحصیلی</span><h1>انتخاب مشاور و پلن</h1><p>رزومه، سابقه، ظرفیت آزاد و هزینهٔ هر پلن را مقایسه کنید. برای ارسال درخواست باید حداقل دو مشاور انتخاب کنید؛ تخصیص نهایی با مدیر مجموعه است.</p></div>
      <section id="consultation-request-status" class="consultation-request-status" hidden aria-live="polite"></section>
      <form id="consultation-request-form">
        <fieldset class="consultation-plans"><legend>پلن موردنظر</legend><div id="consultation-plan-options" class="consultation-plan-options"></div></fieldset>
        <div class="consultation-list-head"><div><h2>مشاوران</h2><p id="consultation-selection-count">حداقل دو مشاور انتخاب کنید.</p></div></div>
        <div id="consultation-consultants" class="consultation-consultants" aria-live="polite"><p>در حال دریافت مشاوران…</p></div>
        <p id="consultation-message" class="consultation-message" role="status" aria-live="polite"></p>
        <button id="consultation-submit" class="consultation-submit" type="submit" disabled>ثبت درخواست برای مدیر</button>
      </form>
      <section id="consultation-history" class="consultation-history"></section>
    </section>
  </main>
  <script src="js/consultations.js"></script>
</body>
</html>
